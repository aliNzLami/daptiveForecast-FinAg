name: Transition Analysis - SHAP & LIME

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-transitions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn shap lime matplotlib

      - name: Run transition analysis script
        run: python interpretability.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "output" ]; then
            git add output/
            git commit -m "Add SHAP/LIME transition analysis results [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "Output directory not found. Skipping commit."
            exit 1
          fi

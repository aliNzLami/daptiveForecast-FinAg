name: Select Transition Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run selection script
        run: python interpretability.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "selected_windows_for_transitions.csv" ]; then
            git add selected_windows_for_transitions.csv
            git commit -m "Add selected windows around transition points [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "File selected_windows_for_transitions.csv not found. Skipping commit."
            exit 1
          fi

name: Download and Push Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install kagglehub
        run: pip install kagglehub pandas

      - name: Download dataset using kagglehub
        run: |
          python -c "
          import os
          import shutil
          import kagglehub
          
          os.makedirs('dataset', exist_ok=True)
          path = kagglehub.dataset_download('iconicwasil/us-crop-prices-and-midwest-climate-data-2010-2024')
          
          for file in os.listdir(path):
              if file.endswith('.csv'):
                  shutil.copy(os.path.join(path, file), os.path.join('dataset', file))
          "

      - name: Commit and push dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/
          git commit -m "Add/download dataset from Kaggle [skip ci]" || echo "No changes to commit"
          git push

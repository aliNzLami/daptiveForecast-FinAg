name: Extract Window Features

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-features:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas scipy

      - name: Run feature extraction
        run: python extract_window_features.py

      - name: Commit and push features
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add window_features.csv
          git commit -m "Add extracted window features [skip ci]" || echo "No changes to commit"
          git push
